name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  # AC-180: the acceptance suite in current Chrome, Edge, Firefox and Safari.
  # Chrome and Edge are the real installed channels, so they are installed here
  # explicitly; Firefox and WebKit are Playwright's own builds. `CI` is set by
  # GitHub Actions, which is what adds the Edge project in playwright.config.ts.
  # Safari is covered by WebKit, which is the closest Playwright offers — see
  # docs/research/test-stack.md.
  acceptance:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: pnpm exec playwright install chrome msedge
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
