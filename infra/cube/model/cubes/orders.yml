cubes:
  - name: orders
    sql_table: public.orders
    description: One row per order line in the sample warehouse.

    joins:
      - name: customers
        sql: '{CUBE}.customer_id = {customers}.id'
        relationship: many_to_one
      - name: products
        sql: '{CUBE}.product_id = {products}.id'
        relationship: many_to_one

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
        # Cube hides primary keys from metadata unless told otherwise. This one
        # is public so the sample model has a high-cardinality dimension —
        # useful for exercising the recommender's capacity rules against real
        # data, and for row-level marking later (AC-092).
        public: true
      - name: status
        sql: status
        type: string
      - name: ordered_at
        sql: ordered_at
        type: time

    measures:
      - name: count
        type: count
      - name: total_amount
        sql: amount
        type: sum
        format: currency
      - name: average_amount
        sql: amount
        type: avg
        format: currency
