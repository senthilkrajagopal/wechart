# Dex 2.45.1, wechart's development and test OIDC provider (T315, AC-257;
# docs/research/dex.md, the user's R20). Development only: static users, the
# password grant for API tests, and memory storage, so every restart starts
# clean with new signing keys.
#
# The users' passwords are test values, listed in test-users.json beside this
# file; `hash` is each one's bcrypt (htpasswd -BinC 10). Change both together,
# then `docker compose restart dex`: Dex reads this file only when it starts.
#
# The image's entrypoint runs gomplate over this file (research Gotcha 5):
# no literal double braces here.

# The browser and wechart's API (on the host in development) both reach Dex
# at this address, so the issuer is the same string for both (research §4).
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

telemetry:
  http: 0.0.0.0:5558

oauth2:
  skipApprovalScreen: true
  # Lets API tests get tokens without a browser (research §6). Test use only.
  passwordConnector: local

enablePasswordDB: true

staticClients:
  - id: wechart
    name: wechart
    secretEnv: WECHART_OIDC_CLIENT_SECRET
    # Exact matches (research §1): the callback wherever wechart's web app is
    # served — the dev server, the phase-1 and security e2e previews, and the
    # Helm release on docker-desktop.
    redirectURIs:
      - http://localhost:5173/api/auth/callback
      - http://localhost:5273/api/auth/callback
      - http://localhost:5373/api/auth/callback
      - http://localhost:8089/api/auth/callback

