# The wechart chart's values (F24, AC-248). docs/deploy.md explains each, and
# deploy/helm/values/docker-desktop.yaml is the set for Docker Desktop, with
# Superset's northwind database as Cube's data source.
#
# No secret goes in here: the data source's password is read from a Secret
# this names, and what wechart generates for itself (Cube's API secret, the
# metadata database's password, xcube's role password and admin token) is
# made at install.

nameOverride: ''
fullnameOverride: ''

# wechart's own images, built from this repository (docs/deploy.md, "Build the
# images"). Both are built from the same commit, so they share one tag.
images:
  api: wechart-api
  web: wechart-web
  # The chart's appVersion when empty.
  tag: ''
  pullPolicy: IfNotPresent

# The web server: the built app, with /api passed to the API.
web:
  service:
    # LoadBalancer is published on the host's localhost on Docker Desktop.
    type: LoadBalancer
    # The port the app is served at.
    port: 8089
  resources: {}

# wechart's API.
api:
  port: 4100
  # wechart's sample dashboards, which name the sample database's cubes.
  # Off: this release's model starts empty, to be built in the Model workspace.
  seed: false
  # This release's model id in xcube (T447): 1–63 of a–z, 0–9, "_" and "-",
  # starting with a letter or digit. One per wechart deployment sharing an
  # xcube database; this chart gives xcube a database of its own.
  xcubeModel: wechart
  # Replicas, any of which serves any request: sessions, the model and the
  # metadata all live in the database or xcube (T423, AC-319). From two, a
  # PodDisruptionBudget keeps one up through a drain.
  replicas: 2
  resources: {}
  # How many days audit records are kept (T370, AC-296): one year by default.
  auditRetentionDays: 365

# wechart's metadata database: dashboards, charts, folders and the model.
meta:
  image: postgres:18.6-alpine3.24
  user: wechart
  database: wechart_meta
  # The volume's size and class; set them for the cluster it runs in.
  storage: 8Gi
  storageClassName: ''
  resources: {}

# Cube's API and its refresh worker.
cube:
  # Cube v1.7.45 with the user's fork's package xcube, which serves the model
  # (T447; infra/cube/cube.js requires it), as items from c0610bb768 (T449),
  # with slices 4-6 from ed08180c37 (T420, R31), and each cube's bound data
  # source in its items and a rebound cube's own SQL alias from e53cf2a8b8
  # (T459), and a data source changed in place served from its new target at
  # once, its cubes keeping their names while it is at the target it was first
  # served with, from 919cff8c6e (T501, R38), the read-only SQL runner
  # from 89628a0e88 (T532, R50), a stopped run's rows from 6d9673ccda
  # (T545), a workspace overlay's data source's catalog from 93a5f7a73b
  # (T547), and a Cube Store run stopped said still running until when,
  # and each run's state, from 2099b13f2d (T548), with xcube's migration 13,
  # and a query Cube Store's router runs followed to its real end from
  # 46ca0ce708 (T549). The seed Job stores the root `default` from `dataSource` below, the same
  # host, port, database and user Cube reads, so the root's cubes keep their
  # names: don't set those four again in `dataSource.env` or `seedFields`.
  # Published by the fork's CI for amd64 and arm64, and pinned by digest
  # (docs/deploy.md); a plain cubejs/cube image won't start with this cube.js.
  image: ghcr.io/senthilkrajagopal/xcube:v1.7.45-46ca0ce708@sha256:340f97c193e0bf3f745301f62bfe84764ded70e93a80aed87e160d68d0287382
  port: 4000
  # How long a Cube process may take to connect to xcube's schema, migrate it
  # and compile every model before it answers: its port stays closed until
  # then (research xcube-slice-2.md, "Start-up"; open question 11).
  startupSeconds: 300
  # Cube's API instances, sharing one queue in Cube Store; the refresh worker
  # stays at one (T423, AC-319; docs/research/cube/ha-topology.md §1, §2).
  # From two, a PodDisruptionBudget keeps one up through a drain.
  replicas: 2
  # The integration plan's runtime settings, for every Cube process (T423):
  # threads that transpile a model as it compiles, 4, or 2 where memory is
  # tight (Cube's own default, one per CPU but one, peaked at 3–5 GB; the
  # xcube image sets 2 when it is unset); and Node's heap in MB, 4 GB
  # or more for the resident models and background compiles
  # (docs/inputs/2026-09-26-integration-plan.md, "Runtime settings";
  # research cube/xcube-runtime.md, Gotcha 6). The queue heartbeat is in
  # cube.js.
  transpileThreads: 4
  heapMegabytes: 4096
  # The warehouse Cube reads: Cube's CUBEJS_DB_* settings.
  dataSource:
    # Cube's driver, e.g. postgres. Required.
    type: ''
    host: ''
    port: ''
    database: ''
    user: ''
    # The Secret, in the release's namespace, holding the password.
    passwordSecret:
      name: ''
      key: password
    # Any other CUBEJS_DB_* variables the driver takes, as plain values,
    # e.g. CUBEJS_DB_SSL: 'true'.
    env: {}
    # The shared root's `default` data source is seeded from these at install
    # (T443, AC-310): type, host, port, database, user, CUBEJS_DB_SSL and the
    # password's Secret. Any other field its driver's password sign-in takes,
    # as xcube names it (core's DRIVERS), goes here, e.g. for Snowflake
    # {account: acme-eu, warehouse: compute_wh, username: cube}; or
    # {sslRejectUnauthorized: false, sslCa: '<PEM>'} for a PostgreSQL CA.
    seedFields: {}
    # Any other CUBEJS_DB_* variables taken from Secrets:
    # VARIABLE: { name: <secret>, key: <key> }.
    secretEnv: {}
  # Anything else for both Cube instances, e.g. CUBEJS_LOG_LEVEL.
  env: {}
  resources: {}
  refreshWorker:
    resources: {}

# Cube Store, one node: router and worker at once.
cubestore:
  # linux/amd64; cubejs/cubestore:v1.7.45-arm64v8 on arm64.
  image: cubejs/cubestore:v1.7.45
  # Its metastore, cache store and pre-aggregations. Size it for the cluster.
  storage: 8Gi
  storageClassName: ''
  # Anything else for Cube Store, e.g. CUBESTORE_LOG_LEVEL. A
  # CUBESTORE_QUERY_TIMEOUT here is given to xcube too, as
  # XCUBE_CUBESTORE_QUERY_TIMEOUT, which must match it: a stopped SQL run on
  # its select workers runs on until it. Both are 120 s unset (T548;
  # docs/research/xcube-2099b13f2d.md). It doesn't reach a query Cube Store's
  # router runs, which runs to its end (T549; xcube-46ca0ce708.md).
  env: {}
  resources: {}

# Sign-in (phase 2, F25; T324). Off, wechart runs as phase 1's single user,
# a Super-Admin, with no sign-in (AC-254).
security:
  enabled: false
  # What the browser sees wechart as, e.g. http://localhost:8089: sign-in's
  # callback and every return address are built from it.
  publicUrl: ''
  # The OIDC provider wechart signs people in with (research/openid-client.md).
  oidc:
    # Exactly the provider's `iss`, as the browser reaches it.
    issuer: ''
    clientId: wechart
    # The Secret holding the client's secret. Empty with dex.enabled: the chart
    # generates one for the Dex it runs and gives it to both.
    clientSecret:
      name: ''
      key: client-secret
    # The claim carrying AD groups.
    groupsClaim: groups
    scopes: openid profile email
    # A plain-HTTP issuer: development only.
    allowHttp: false
    # Where the API reaches the provider when that differs from the issuer
    # the browser uses (an in-cluster Service): only the origin is rewritten.
    backchannelUrl: ''
  # The group whose members are Super-Admins (AC-256), as the provider sends it.
  # Required when security.enabled: the chart refuses to render without it (T416, AC-318).
  superAdminGroup: ''
  # The development provider, Dex 2.45.1, beside wechart with the test users
  # of infra/dex (AC-257): never for production.
  dex:
    enabled: false
    image: dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
    # The port the browser reaches Dex at on the host (a LoadBalancer on
    # Docker Desktop), which is also the issuer's. Compose's Dex has 5556.
    port: 5557
    resources: {}
