# The web server's configuration (docs/research/nginx.md): the built app, with
# any path that is not a file answered by index.html for the app's own
# routes, and /api passed to the API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wechart.component" (list . "web") }}
  labels:
    {{- include "wechart.labels" (list . "web") | nindent 4 }}
data:
  default.conf: |
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # nginx's own redirects stay relative, never naming port 8080.
        absolute_redirect off;

        # Kept in every location below, including those with their own headers.
        add_header_inherit merge;
        add_header X-Content-Type-Options "nosniff" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        {{- if (.Values.security).enabled }}
        # With security on, every page and every file of the app asks the API
        # whether anyone is signed in, and a page nobody is signed in to goes
        # to sign-in, carrying its address: no wechart content is served first
        # (T321, AC-251; research/openid-client.md, "nginx: gating page
        # requests"). /api/ is the API's own to refuse (T318).
        location = /_auth {
            internal;
            proxy_pass http://{{ include "wechart.host" (list . "api") }}:{{ .Values.api.port }}/api/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            # proxy_set_header is all-or-nothing per level (research/nginx.md).
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location @signin {
            return 302 /api/auth/login?returnTo=$request_uri;
        }
        {{- end }}

        # With no URI part, /api/load reaches the API as /api/load. The
        # browser's own X-Request-Id passes through untouched: the API logs
        # each query by it, and a tile cancels its query by it. The API's
        # Service is named in full: nginx resolves it once, as it starts.
        location /api/ {
            proxy_pass http://{{ include "wechart.host" (list . "api") }}:{{ .Values.api.port }};
            # Above the API's largest body, an image of 3 MiB as JSON, so the
            # API answers for itself.
            client_max_body_size 4m;
            # Past nginx's 60 s: a connection test waits on two 30 s steps
            # (T361), a publish on xcube's 120 s compile wait (research
            # nginx.md, "Longest single API request").
            proxy_read_timeout 130s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Sign-in's own pages for its end (design 09, states C and D; T697):
        # the API serves them whole, with no app bundle, to anyone, since they
        # are for those not signed in. Nothing of wechart is in them (AC-251).
        location ~ ^/(signed-out|sign-in-failed)$ {
            proxy_pass http://{{ include "wechart.host" (list . "api") }}:{{ .Values.api.port }};
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Vite's hashed files never change; one that is missing is a 404,
        # not the app.
        location /assets/ {
            {{- if (.Values.security).enabled }}
            auth_request /_auth;
            error_page 401 = @signin;
            {{- end }}
            try_files $uri =404;
            {{- if (.Values.security).enabled }}
            # Only for the signed-in: no shared cache may hand them on (T321's review).
            add_header Cache-Control "private, max-age=31536000, immutable";
            {{- else }}
            add_header Cache-Control "public, max-age=31536000, immutable";
            {{- end }}
        }

        location = /index.html {
            {{- if (.Values.security).enabled }}
            auth_request /_auth;
            error_page 401 = @signin;
            {{- end }}
            add_header Cache-Control "no-cache";
        }

        location / {
            {{- if (.Values.security).enabled }}
            auth_request /_auth;
            error_page 401 = @signin;
            {{- end }}
            try_files $uri /index.html;
        }
    }
