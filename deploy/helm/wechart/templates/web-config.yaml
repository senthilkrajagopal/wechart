# The web server's configuration (docs/research/nginx.md): the built app, with
# any path that is not a file answered by index.html for the app's own
# routes, and /api passed to the API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wechart.component" (list . "web") }}
  labels:
    {{- include "wechart.labels" (list . "web") | nindent 4 }}
data:
  default.conf: |
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # nginx's own redirects stay relative, never naming port 8080.
        absolute_redirect off;

        # Kept in every location below, including those with their own headers.
        add_header_inherit merge;
        add_header X-Content-Type-Options "nosniff" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Cube reads the model from the API's own Service, inside the
        # cluster; the browser has no business there.
        location /api/cube-model/ {
            return 404;
        }

        # With no URI part, /api/load reaches the API as /api/load. The
        # browser's own X-Request-Id passes through untouched: the API logs
        # each query by it, and a tile cancels its query by it. The API's
        # Service is named in full: nginx resolves it once, as it starts.
        location /api/ {
            proxy_pass http://{{ include "wechart.host" (list . "api") }}:{{ .Values.api.port }};
            # Above the API's largest body, an image of 3 MiB as JSON, so the
            # API answers for itself.
            client_max_body_size 4m;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Vite's hashed files never change; one that is missing is a 404,
        # not the app.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri /index.html;
        }
    }
