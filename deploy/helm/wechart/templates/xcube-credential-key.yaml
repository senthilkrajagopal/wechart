{{- /*
xcube's credential key, made once for the release (T455, AC-324; docs/research/
kubernetes-job-generated-secret.md). Helm can't make an X25519 key, so a Job
runs xcube's own keygen, in xcube's image, and writes:
- a Secret with `<kid>.pem` and `<kid>.check`, which Cube's pods mount and
  nothing of wechart's does (AC-298);
- a ConfigMap with the public JWK and its kid, which the API seals to and
  Cube's pods name the key by.

Neither is Helm's: an uninstall leaves them, so a reinstall keeps the key the
stored credentials were sealed to. To bring a key of your own, create the
Secret before installing; the Job then publishes its public half.

A plain Job, named by its pod template like the bootstrap Job, rather than a
hook: Cube's pods wait for the Secret, so a post-install hook would never run
under `--wait` (research, "Helm integration"). Its ServiceAccount may get only
these two objects, and create them.
*/ -}}
{{- $script := .Files.Get "files/xcube-credential-key.mjs" | required "files/xcube-credential-key.mjs is missing from the chart" }}
{{- $component := include "wechart.component" (list . "xcube-credential-key") }}
{{- /* Room for "-" and the hash within 63 characters (T455's review). */}}
{{- $prefix := $component | trunc 54 | trimSuffix "-" }}
{{- $config := printf "%s-%s" $prefix (sha256sum $script | trunc 8) }}
{{- $pod := include "wechart.xcubeCredentialKeyPod" (list . $config $component) }}
{{- $job := printf "%s-%s" $prefix (sha256sum $pod | trunc 8) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $config }}
  labels:
    {{- include "wechart.labels" (list . "xcube-credential-key") | nindent 4 }}
data:
  xcube-credential-key.mjs: |-
    {{- $script | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $component }}
  labels:
    {{- include "wechart.labels" (list . "xcube-credential-key") | nindent 4 }}
# The pod mounts a token of its own, good for ten minutes.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $component }}
  labels:
    {{- include "wechart.labels" (list . "xcube-credential-key") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "wechart.xcubeKeySecret" . }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "wechart.xcubePublicKeyConfigMap" . }}]
    verbs: [get]
  # `create` can't be held to a name (research, "RBAC").
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $component }}
  labels:
    {{- include "wechart.labels" (list . "xcube-credential-key") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $component }}
subjects:
  - kind: ServiceAccount
    name: {{ $component }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job }}
  labels:
    {{- include "wechart.labels" (list . "xcube-credential-key") | nindent 4 }}
spec:
  # A 403 before the RoleBinding takes, or the API server away: tried again.
  backoffLimit: 10
  template:
    {{- $pod | nindent 4 }}

{{- define "wechart.xcubeCredentialKeyPod" }}
{{- $ := index . 0 }}
{{- $config := index . 1 }}
{{- $component := index . 2 }}
metadata:
  labels:
    {{- include "wechart.labels" (list $ "xcube-credential-key") | nindent 4 }}
spec:
  serviceAccountName: {{ $component }}
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: OnFailure
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: key
      image: {{ $.Values.cube.image }}
      imagePullPolicy: IfNotPresent
      command: [node, /job/xcube-credential-key.mjs]
      env:
        - name: SECRET
          value: {{ include "wechart.xcubeKeySecret" $ | quote }}
        - name: CONFIG_MAP
          value: {{ include "wechart.xcubePublicKeyConfigMap" $ | quote }}
        - name: CREDENTIALS
          value: /var/run/secrets/wechart/api
        - name: WORK
          value: /work
        - name: KEYGEN
          value: /cube/node_modules/xcube/dist/src/bin/keygen.js
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: api
          mountPath: /var/run/secrets/wechart/api
          readOnly: true
        - name: work
          mountPath: /work
        - name: script
          mountPath: /job
          readOnly: true
  volumes:
    # The cluster's API: a ten-minute token, its CA and the namespace.
    - name: api
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
    # The new key never touches a disk.
    - name: work
      emptyDir:
        medium: Memory
    - name: script
      configMap:
        name: {{ $config }}
{{- end }}
