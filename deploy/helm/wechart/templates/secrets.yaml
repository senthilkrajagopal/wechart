{{- /*
What wechart generates for itself at install: Cube's API secret, which only
wechart and Cube hold (AC-007); the model store's key, which nothing reads
since xcube serves the model and T431 retires; the metadata database's
password, with the URL the API connects by; and xcube's, below.

Generated once and read back on every upgrade (`lookup`), so an upgrade never
changes them (docs/research/helm.md, "Generated secrets"). Kept on uninstall:
the metadata database's volume outlives an uninstall too, and its password was
fixed when it was first initialised, so a new one would lock the API out of it.
*/ -}}
{{- $name := include "wechart.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data | default dict }}{{- end }}
{{- $cubeApiSecret := get $data "cube-api-secret" | b64dec | default (randAlphaNum 48) }}
{{- $modelKey := get $data "model-key" | b64dec | default (randAlphaNum 48) }}
{{- $metaPassword := get $data "meta-password" | b64dec | default (randAlphaNum 32) }}
{{- $metaUrl := printf "postgres://%s:%s@%s:5432/%s" .Values.meta.user $metaPassword (include "wechart.host" (list . "meta")) .Values.meta.database }}
{{- /* Sign-in (T324): the session cookie's signing secret, and the client
secret the chart's Dex and the API share. Generated once, like the rest. */}}
{{- $sessionSecret := get $data "session-secret" | b64dec | default (randAlphaNum 48) }}
{{- $oidcClientSecret := get $data "oidc-client-secret" | b64dec | default (randAlphaNum 48) }}
{{- /* xcube (T447): the password of its role in the metadata database, which
the bootstrap Job sets and both Cube processes connect with; and the admin
token its routes take, which Cube's API instance and wechart's API share (R29:
a static token until slice 4). Letters and digits only: xcube takes a token of
32 or more of [A-Za-z0-9._~-] (docs/research/xcube-slice-2.md). */}}
{{- $xcubePassword := get $data "xcube-db-password" | b64dec | default (randAlphaNum 32) }}
{{- $xcubeUrl := printf "postgres://xcube:%s@%s:5432/%s" $xcubePassword (include "wechart.host" (list . "meta")) .Values.meta.database }}
{{- $xcubeAdminToken := get $data "xcube-admin-token" | b64dec | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "wechart.labels" (list . "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  cube-api-secret: {{ $cubeApiSecret | b64enc | quote }}
  model-key: {{ $modelKey | b64enc | quote }}
  meta-password: {{ $metaPassword | b64enc | quote }}
  meta-url: {{ $metaUrl | b64enc | quote }}
  session-secret: {{ $sessionSecret | b64enc | quote }}
  oidc-client-secret: {{ $oidcClientSecret | b64enc | quote }}
  xcube-db-password: {{ $xcubePassword | b64enc | quote }}
  xcube-db-url: {{ $xcubeUrl | b64enc | quote }}
  xcube-admin-token: {{ $xcubeAdminToken | b64enc | quote }}
