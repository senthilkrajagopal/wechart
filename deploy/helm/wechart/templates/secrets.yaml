{{- /*
What wechart generates for itself at install: Cube's API secret, which only
wechart and Cube hold (AC-007); the metadata database's password, with the
URL the API connects by; and xcube's, below. The model store's key went with
the store (T431): an upgrade drops it from the Secret.

Generated once and read back on every upgrade (`lookup`), so an upgrade never
changes them (docs/research/helm.md, "Generated secrets"). Kept on uninstall:
the metadata database's volume outlives an uninstall too, and its password was
fixed when it was first initialised, so a new one would lock the API out of it.
*/ -}}
{{- $name := include "wechart.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data | default dict }}{{- end }}
{{- $cubeApiSecret := get $data "cube-api-secret" | b64dec | default (randAlphaNum 48) }}
{{- $metaPassword := get $data "meta-password" | b64dec | default (randAlphaNum 32) }}
{{- $metaUrl := printf "postgres://%s:%s@%s:5432/%s" .Values.meta.user $metaPassword (include "wechart.host" (list . "meta")) .Values.meta.database }}
{{- /* Sign-in (T324): the session cookie's signing secret, and the client
secret the chart's Dex and the API share. Generated once, like the rest. */}}
{{- $sessionSecret := get $data "session-secret" | b64dec | default (randAlphaNum 48) }}
{{- $oidcClientSecret := get $data "oidc-client-secret" | b64dec | default (randAlphaNum 48) }}
{{- /* xcube (T447): the password of its role in the metadata database, which
the bootstrap Job sets and both Cube processes connect with. */}}
{{- $xcubePassword := get $data "xcube-db-password" | b64dec | default (randAlphaNum 32) }}
{{- $xcubeUrl := printf "postgres://xcube:%s@%s:5432/%s" $xcubePassword (include "wechart.host" (list . "meta")) .Values.meta.database }}
{{- /* wechart's service credential (T420, AC-326; slice 4), which replaced
xcube's static admin token: an RSA key pair made once. The API signs with the
private half; Cube's API instance is given a certificate of the public half,
which xcube takes as a service key, naming it by its RFC 7638 thumbprint as the
API does (docs/research/cube/tokens-and-service-credential.md, "Kubernetes";
xcube-slice-4.md, "The service token"). An upgrade drops the old admin token. */}}
{{- /* The install Job's token (T443, AC-310, AC-251): the one thing the API's
route to seed the shared root's `default` data source answers. */}}
{{- $seedToken := get $data "seed-token" | b64dec | default (randAlphaNum 48) }}
{{- $serviceKey := get $data "service-key.pem" | b64dec }}
{{- $serviceCert := get $data "service-cert.pem" | b64dec }}
{{- if not (and $serviceKey $serviceCert) }}
{{- $generated := genSelfSignedCert "wechart-service" nil nil 36500 }}
{{- $serviceKey = $generated.Key }}
{{- $serviceCert = $generated.Cert }}
{{- end }}
{{- /* wechart's query signing key (T437, AC-326; slice 4): every query token
is RS256 under it, and the API pushes its public half to xcube at start, so
xcube is given nothing by configuration and no other pod holds it. An RSA key
made once, 4096 bits in PKCS#1 (`genPrivateKey "rsa"`;
docs/research/cube/tokens-and-service-credential.md, "Kubernetes"). */}}
{{- $signingKey := get $data "signing-key.pem" | b64dec | default (genPrivateKey "rsa") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "wechart.labels" (list . "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  cube-api-secret: {{ $cubeApiSecret | b64enc | quote }}
  meta-password: {{ $metaPassword | b64enc | quote }}
  meta-url: {{ $metaUrl | b64enc | quote }}
  session-secret: {{ $sessionSecret | b64enc | quote }}
  oidc-client-secret: {{ $oidcClientSecret | b64enc | quote }}
  xcube-db-password: {{ $xcubePassword | b64enc | quote }}
  xcube-db-url: {{ $xcubeUrl | b64enc | quote }}
  service-key.pem: {{ $serviceKey | b64enc | quote }}
  service-cert.pem: {{ $serviceCert | b64enc | quote }}
  signing-key.pem: {{ $signingKey | b64enc | quote }}
  seed-token: {{ $seedToken | b64enc | quote }}
