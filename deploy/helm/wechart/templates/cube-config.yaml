# wechart's Cube configuration, infra/cube/cube.js, as docker-compose mounts
# it: the model is read from wechart's model store (the API), named in each
# request's signed security context. files/cube.js is a link to that file, so
# the chart and local development run the same one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wechart.component" (list . "cube-config") }}
  labels:
    {{- include "wechart.labels" (list . "cube-config") | nindent 4 }}
data:
  cube.js: |-
    {{- .Files.Get "files/cube.js" | required "files/cube.js is missing from the chart (a link to infra/cube/cube.js)" | nindent 4 }}
