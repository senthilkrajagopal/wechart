{{- /*
MCP's own host (F41, AC-476; docs/research/gateway-api.md): an HTTPRoute that
routes `Exact` `/mcp` alone, on that host alone, to the API Service. Any other
path on the host matches no rule, which the Gateway answers 404 without the
API (Gotcha 1). Nothing here without `mcp.host`.
*/ -}}
{{- with .Values.mcp }}
{{- if .host }}
{{- $name := include "wechart.component" (list $ "mcp") }}
{{- if .gateway.create }}
# Mode A: the chart's own Gateway, one HTTPS listener for the MCP host,
# terminating TLS with a Secret in this namespace (no ReferenceGrant needed).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  labels:
    {{- include "wechart.labels" (list $ "mcp") | nindent 4 }}
spec:
  gatewayClassName: {{ required "mcp.gateway.className is required with mcp.gateway.create: the cluster's Envoy Gateway GatewayClass" .gateway.className | quote }}
  listeners:
    - name: mcp-https
      hostname: {{ .host | quote }}
      protocol: HTTPS
      port: {{ int .gateway.port }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ required "mcp.tlsSecretName is required with mcp.gateway.create: the host's kubernetes.io/tls Secret" .tlsSecretName | quote }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "wechart.labels" (list $ "mcp") | nindent 4 }}
spec:
  parentRefs:
    {{- if .gateway.create }}
    - name: {{ $name }}
      sectionName: mcp-https
    {{- else }}
    {{- if not .gateway.parentRefs }}
    {{- fail "mcp.gateway.parentRefs is required without mcp.gateway.create: the Gateway the MCP route attaches to" }}
    {{- end }}
    {{- toYaml .gateway.parentRefs | nindent 4 }}
    {{- end }}
  hostnames:
    - {{ .host | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - name: {{ include "wechart.component" (list $ "api") }}
          port: {{ int $.Values.api.port }}
      # As /api's behind nginx (130 s), past Envoy's 15 s default, which
      # would cut a tool call short (gateway-api.md, finding 4, Gotcha 5).
      timeouts:
        request: 130s
        backendRequest: 130s
---
# Only the listed sources reach /mcp (AC-476): everything is denied but one
# Allow rule, the first match winning; a denied request answers 403
# "RBAC: access denied" and never reaches the API (gateway-api.md, "Envoy
# Gateway SecurityPolicy"). Anthropic's range only when asked for.
{{- $sources := concat (.allowedSourceRanges | default list) (ternary (list "160.79.104.0/21") (list) (.allowAnthropicEgress | default false)) }}
{{- if not $sources }}
{{- fail "mcp.allowedSourceRanges is required with mcp.host: the enterprise network's CIDR ranges let in to /mcp" }}
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "wechart.labels" (list $ "mcp") | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}
  authorization:
    defaultAction: Deny
    rules:
      - name: allowed-sources
        action: Allow
        principal:
          clientCIDRs:
            {{- toYaml $sources | nindent 12 }}
{{- with .clientIPDetection }}
{{- if not $.Values.mcp.gateway.create }}
{{- fail "mcp.clientIPDetection is mode A's alone: in mode B the Gateway's owner sets it" }}
{{- end }}
---
# How the chart's Gateway finds the client's address (AC-474; gateway-api.md,
# "How the client IP reaches the API"), for the allow-list and the API.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "wechart.labels" (list $ "mcp") | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $name }}
  clientIPDetection:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
