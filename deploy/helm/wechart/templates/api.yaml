{{- $name := include "wechart.component" (list . "api") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "wechart.labels" (list . "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "wechart.selectorLabels" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
---
# wechart's API (packages/api): the only thing the browser talks to besides
# the web server, and the only holder of Cube's secret (AC-007).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "wechart.labels" (list . "api") | nindent 4 }}
spec:
  # Any replica serves any request: sessions, the model and the metadata live
  # in the database or xcube, and Cube calls nothing of the API's (T418, T421,
  # T431). Rolled one at a time, a new one Ready before an old one stops
  # (T423, AC-319; Kubernetes' default RollingUpdate at two replicas).
  replicas: {{ int .Values.api.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "wechart.selectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wechart.labels" (list . "api") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Above the preStop sleep and the 15 s the API gives its requests under
      # way to finish (packages/api/src/main.ts; T423).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The API migrates the metadata database as it starts, and exits if
        # it can't reach it: wait for it first.
        - name: wait-for-meta
          image: {{ .Values.meta.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -q -h "$HOST" -p 5432; do echo "waiting for $HOST"; sleep 2; done
          env:
            - name: HOST
              value: {{ include "wechart.host" (list . "meta") }}
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: api
          image: {{ include "wechart.image" (list . .Values.images.api) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: WECHART_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "wechart.secretName" . }}
                  key: meta-url
            - name: CUBE_API_URL
              value: {{ printf "http://%s:%d/cubejs-api" (include "wechart.host" (list . "cube")) (int .Values.cube.port) | quote }}
            - name: CUBE_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wechart.secretName" . }}
                  key: cube-api-secret
            # How long the audit trail keeps its records, in days (T370, AC-296).
            - name: WECHART_AUDIT_RETENTION_DAYS
              value: {{ .Values.api.auditRetentionDays | quote }}
            # The refresh worker's own /readyz and /livez (T162, AC-156).
            - name: CUBE_WORKER_URL
              value: {{ printf "http://%s:%d" (include "wechart.host" (list . "cube-refresh-worker")) (int .Values.cube.port) | quote }}
            # This release's model in xcube, which the API pushes its published
            # files to and names in every token (T447, AC-333, AC-334), and the
            # service key its own calls to Cube and xcube are signed with
            # (T420, AC-326; slice 4). No other pod has it.
            - name: WECHART_XCUBE_MODEL
              value: {{ required "api.xcubeModel is required: this release's model id in xcube" .Values.api.xcubeModel | quote }}
            - name: WECHART_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "wechart.secretName" . }}
                  key: service-key.pem
            # xcube's public key, which credentials are sealed to; the API
            # won't start without it (T333, AC-324). Its Job publishes it
            # (T455): until then this pod waits, and never runs without it.
            - name: WECHART_XCUBE_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "wechart.xcubePublicKeyConfigMap" . }}
                  key: jwk
            {{- if and .Values.cube.dataSource.type .Values.cube.dataSource.passwordSecret.name }}
            # The install Job's token, for its seeding of the shared root's
            # `default` data source alone (T443, AC-310; seed-default.yaml):
            # only where that Job is rendered, so no route waits for none.
            - name: WECHART_SEED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "wechart.secretName" . }}
                  key: seed-token
            {{- end }}
            {{- if .Values.api.seed }}
            # wechart's sample dashboards, which name the sample database's cubes.
            - name: WECHART_SEED
              value: "1"
            {{- end }}
            {{- with .Values.security }}
            {{- if .enabled }}
            # Sign-in (T324; packages/api/src/config.ts): everyone signs in
            # through the OIDC provider; the session lives in the metadata
            # database, signed by a secret the chart generated.
            - name: WECHART_SECURITY
              value: oidc
            - name: WECHART_PUBLIC_URL
              value: {{ required "security.publicUrl is required when security.enabled, e.g. http://localhost:8089" .publicUrl | quote }}
            - name: WECHART_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wechart.secretName" $ }}
                  key: session-secret
            - name: WECHART_OIDC_ISSUER
              value: {{ include "wechart.oidcIssuer" $ | quote }}
            - name: WECHART_OIDC_CLIENT_ID
              value: {{ .oidc.clientId | quote }}
            - name: WECHART_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- include "wechart.oidcClientSecretRef" $ | nindent 18 }}
            - name: WECHART_OIDC_GROUPS_CLAIM
              value: {{ .oidc.groupsClaim | quote }}
            - name: WECHART_OIDC_SCOPES
              value: {{ .oidc.scopes | quote }}
            {{- if .oidc.allowHttp }}
            - name: WECHART_OIDC_ALLOW_HTTP
              value: "true"
            {{- end }}
            {{- if or .oidc.backchannelUrl .dex.enabled }}
            # The browser reaches the issuer on the host; this pod reaches the
            # same provider at its Service (research/dex.md §4, pattern B).
            - name: WECHART_OIDC_BACKCHANNEL_URL
              value: {{ default (printf "http://%s:%d" (include "wechart.host" (list $ "dex")) (int .dex.port)) .oidc.backchannelUrl | quote }}
            {{- end }}
            # Required with sign-in on (T416, AC-318; the user's R26): without
            # it nobody could reach the admin surfaces, and the API refuses to start.
            - name: WECHART_SUPER_ADMIN_GROUP
              value: {{ required "security.superAdminGroup is required when security.enabled: the AD group whose members are Super-Admins" .superAdminGroup | quote }}
            {{- end }}
            {{- end }}
          # It listens only once xcube says it holds the credential key (T455,
          # AC-324), waiting while Cube starts: as long as Cube may take, and
          # a minute more, before the liveness probe may restart it.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: {{ div (add (int .Values.cube.startupSeconds) 60) 5 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          # Out of the Service's endpoints before it is told to stop: the two
          # happen at once otherwise (T423; research cube/ha-topology.md,
          # "Kubernetes pod termination").
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- if ge (int .Values.api.replicas) 2 }}
---
{{ include "wechart.disruptionBudget" (list . "api") }}
{{- end }}
