{{- /*
Cube's API and its refresh worker: the same image, configuration and
environment, the worker told only to build and refresh pre-aggregations
(docker-compose.yml; docs/research/cube/configuration-deployment.md §4, §8).
*/ -}}
{{- range $component := list "cube" "cube-refresh-worker" }}
{{- $name := include "wechart.component" (list $ $component) }}
{{- $values := ternary $.Values.cube $.Values.cube.refreshWorker (eq $component "cube") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "wechart.labels" (list $ $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "wechart.selectorLabels" (list $ $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.cube.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "wechart.labels" (list $ $component) | nindent 4 }}
spec:
  # Cube's API instances, as many as the values give, share one queue in Cube
  # Store (T423, AC-319); the refresh worker must be one
  # (docs/research/cube/configuration-deployment.md §8; ha-topology.md §2).
  replicas: {{ ternary (int $.Values.cube.replicas) 1 (eq $component "cube") }}
  selector:
    matchLabels:
      {{- include "wechart.selectorLabels" (list $ $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wechart.labels" (list $ $component) | nindent 8 }}
      annotations:
        checksum/cube-config: {{ include (print $.Template.BasePath "/cube-config.yaml") $ | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- if eq $component "cube" }}
      # Above the preStop sleep, the graceful shutdown's 15 s and the second
      # after it that Cube's own timer ends the process at (T423; research
      # cube/ha-topology.md §6).
      terminationGracePeriodSeconds: 30
      {{- end }}
      # The image runs as root; its node user, uid 1000, is enough for Cube
      # with wechart's configuration, which writes nothing to disk
      # (docs/research/cube/kubernetes.md, "Writable paths"; observed on
      # Docker Desktop, docs/deploy.md).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # xcube's role and schema come from the bootstrap Job; a Cube process
      # started before them exits rather than retrying (research
      # xcube-slice-2.md, Gotcha 14). So each waits here until it can connect
      # as xcube and the schema is there (T447).
      initContainers:
        - name: wait-for-xcube-schema
          image: {{ $.Values.meta.image }}
          command:
            - sh
            - -c
            - until psql "$XCUBE_DATABASE_URL" -Atc "select 1 from pg_namespace where nspname = 'xcube'" | grep -q 1; do sleep 2; done
          env:
            - name: XCUBE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "wechart.secretName" $ }}
                  key: xcube-db-url
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: cube
          image: {{ $.Values.cube.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            {{- include "wechart.cubeEnv" $ | nindent 12 }}
            # The credential key xcube opens data sources' secrets with, by
            # the kid its Job published (T455, AC-324): in the API instance
            # and the worker alike, which builds through connections too
            # (research xcube-slice-6.md, "xcube's credential key").
            - name: XCUBE_CREDENTIAL_KEY_IDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "wechart.xcubePublicKeyConfigMap" $ }}
                  key: kid
            {{- if eq $component "cube-refresh-worker" }}
            - name: CUBEJS_REFRESH_WORKER
              value: "true"
            {{- else }}
            # A certificate of wechart's service key (T420, AC-326; slice 4):
            # xcube's admin routes, the jobs API and introspection take its
            # tokens. On the API instance only, which serves them, never the
            # worker (research xcube-slice-4.md, "Environment").
            - name: XCUBE_SERVICE_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "wechart.secretName" $ }}
                  key: service-cert.pem
            # Stopped, it takes no new request (503, with Retry-After) and
            # lets those under way finish for 15 s, past a long-poll's 10 s,
            # where it would otherwise exit at once and cut them off (T423;
            # research cube/ha-topology.md §1, "Graceful stop").
            - name: CUBEJS_GRACEFUL_SHUTDOWN
              value: "15"
            # Cube Store's own query timeout, which xcube can't read from it:
            # a SQL run stopped on Cube Store runs on until it, and xcube says
            # until when (T548, AC-378; research xcube-2099b13f2d.md). Unset
            # on both, both are 120 s.
            {{- with $.Values.cubestore.env.CUBESTORE_QUERY_TIMEOUT }}
            - name: XCUBE_CUBESTORE_QUERY_TIMEOUT
              value: {{ . | toString | quote }}
            {{- end }}
            {{- end }}
          # With contextToAppId configured, as xcube's config() does,
          # /readyz answers once the server is up and tests nothing further;
          # /livez tests the data source and Cube Store, and an outage there
          # is not something a restart mends. So /readyz for both, and the
          # data source is checked by a query (deploy/helm/verify.sh)
          # (docs/research/cube/kubernetes.md, Gotchas 1 and 2).
          #
          # Under xcube the port stays closed until every model is compiled
          # (research xcube-slice-2.md, "Start-up"): the startup probe waits
          # that out before the liveness probe may restart it (T447).
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: {{ div (int $.Values.cube.startupSeconds) 5 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- if eq $component "cube" }}
          # Out of the Service's endpoints before it is told to stop: the two
          # happen at once otherwise (T423; research cube/ha-topology.md,
          # "Kubernetes pod termination").
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /cube/conf/cube.js
              subPath: cube.js
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: credential-keys
              mountPath: /run/secrets/xcube-credential-keys
              readOnly: true
          {{- with $values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "wechart.component" (list $ "cube-config") }}
        - name: tmp
          emptyDir: {}
        # The Job's Secret (T455), not optional: the pod waits for it rather
        # than start xcube with no key (research
        # kubernetes-job-generated-secret.md, "Pod behavior"). Readable by
        # Cube's group alone, which fsGroup makes the files' (Gotcha 5).
        - name: credential-keys
          secret:
            secretName: {{ include "wechart.xcubeKeySecret" $ }}
            defaultMode: 0440
{{- if and (eq $component "cube") (ge (int $.Values.cube.replicas) 2) }}
---
{{ include "wechart.disruptionBudget" (list $ $component) }}
{{- end }}
{{- end }}
