# wechart on Docker Desktop's Kubernetes (context docker-desktop, namespace
# wechart), with Cube reading the northwind database the Superset install in
# the same cluster uses (F24, AC-248; docs/deploy.md).

web:
  service:
    type: LoadBalancer
    # http://localhost:8089. 8088 is Superset's; 8090, 8092 and 8094 are taken
    # in this cluster too.
    port: 8089

api:
  # xcube's development public key (infra/xcube/dev-credential-key.pub.jwk):
  # this cluster runs development keys, like compose (T333, AC-324).
  xcubePublicKey: '{"kty":"OKP","crv":"X25519","x":"OKDigdpTk6aEk-tzx6VQP-gIWx08RyrSF-GDtz_z3Gc","kid":"uYWeMx6i173fsiolFp1xi-qiav50k52AGinM56Y8JEw"}'

cube:
  # Cube v1.7.45 with the user's fork's package xcube, formerly
  # cube-introspection (T275, T414, T417, R10), which from 83cb9f0888 serves
  # the model too (T447), built locally and pushed nowhere: the node runs on
  # Docker's engine, so the pods use the local image, as they do wechart's
  # own (docs/deploy.md). Cube and its refresh worker both run it, with the
  # image's own command. Tagged by the fork's commit: a rebuild under the same
  # tag wouldn't restart the pods, which pull only what isn't there.
  image: xcube:v1.7.45-83cb9f0888
  dataSource:
    type: postgres
    host: superset-postgresql.superset.svc.cluster.local
    port: 5432
    database: northwind
    user: postgres
    # Copied from Superset's Secret into this namespace (docs/deploy.md,
    # "The data source's Secret"); only its name is here.
    passwordSecret:
      name: wechart-northwind
      key: password

cubestore:
  # The host is Apple silicon.
  image: cubejs/cubestore:v1.7.45-arm64v8
