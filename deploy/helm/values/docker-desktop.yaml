# wechart on Docker Desktop's Kubernetes (context docker-desktop, namespace
# wechart), with Cube reading the northwind database the Superset install in
# the same cluster uses (F24, AC-248; docs/deploy.md).

web:
  service:
    type: LoadBalancer
    # http://localhost:8089. 8088 is Superset's; 8090, 8092 and 8094 are taken
    # in this cluster too.
    port: 8089

cube:
  # Cube v1.7.45 with the user's fork's package xcube, formerly
  # cube-introspection (T275, T414, T417, R10), which from 83cb9f0888 serves
  # the model too (T447), as items from c0610bb768 (T449), with slices 4-6
  # from ed08180c37 (T420, R31), and each cube's bound data source in its
  # items from e53cf2a8b8 (T459), and a data source changed in place served
  # from its new target, its cubes keeping their names while it is at the
  # target it was first served with, from 919cff8c6e (T501, R38), and the
  # read-only SQL runner from 89628a0e88 (T532, R50), a stopped run's rows
  # from 6d9673ccda (T545), a workspace overlay's data source's catalog from
  # 93a5f7a73b (T547), and a Cube Store run stopped said still running until
  # when, and each run's state, from 2099b13f2d (T548), and a query Cube
  # Store's router runs followed to its real end from 46ca0ce708 (T549), and
  # a building build the queue's cancel takes out really stopped, none of it
  # kept, from 74c933bdb8 (T554), and one name per item model-wide, every
  # reference up its folder path and bare names from 256d632371 (T701, R71,
  # R72), whose schema 14 refuses a folder-prefixed one: installed fresh
  # (T702), and the SQL runner's `{{name}}` values bound and the catalog's
  # foreign keys through a stored connection from bb188d8ada (T811, T806). It
  # is published for amd64 and arm64 (bb188d8ada from xcube's machine, CI's
  # Actions being off), pinned here by digest (docs/deploy.md). Cube and its
  # refresh worker both run it, with the image's own command.
  image: ghcr.io/senthilkrajagopal/xcube:v1.7.45-bb188d8ada@sha256:96024be5ca88d227ff456a0d832642e9a42a27c6a7d55187520a00d84389f63f
  dataSource:
    type: postgres
    host: superset-postgresql.superset.svc.cluster.local
    port: 5432
    database: northwind
    user: postgres
    # Copied from Superset's Secret into this namespace (docs/deploy.md,
    # "The data source's Secret"); only its name is here.
    passwordSecret:
      name: wechart-northwind
      key: password

cubestore:
  # The host is Apple silicon.
  image: cubejs/cubestore:v1.7.45-arm64v8
