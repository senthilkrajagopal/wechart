# wechart on Docker Desktop's Kubernetes (context docker-desktop, namespace
# wechart), with Cube reading the northwind database the Superset install in
# the same cluster uses (F24, AC-248; docs/deploy.md).

web:
  service:
    type: LoadBalancer
    # http://localhost:8089. 8088 is Superset's; 8090, 8092 and 8094 are taken
    # in this cluster too.
    port: 8089

cube:
  # Cube v1.7.45 with the user's fork's package xcube, formerly
  # cube-introspection (T275, T414, T417, R10), which from 83cb9f0888 serves
  # the model too (T447), as items from c0610bb768 (T449), with slices 4-6
  # from ed08180c37 (T420, R31). The fork's CI publishes it for amd64 and
  # arm64, pinned here by digest (docs/deploy.md). Cube and its refresh
  # worker both run it, with the image's own command.
  image: ghcr.io/senthilkrajagopal/xcube:v1.7.45-ed08180c37@sha256:bc041aa208df0cd748b59fbfdbeca8684538f08c67f6020b0316d1efd1eb6fd8
  dataSource:
    type: postgres
    host: superset-postgresql.superset.svc.cluster.local
    port: 5432
    database: northwind
    user: postgres
    # Copied from Superset's Secret into this namespace (docs/deploy.md,
    # "The data source's Secret"); only its name is here.
    passwordSecret:
      name: wechart-northwind
      key: password

cubestore:
  # The host is Apple silicon.
  image: cubejs/cubestore:v1.7.45-arm64v8
