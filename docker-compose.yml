# Local development and test dependencies: wechart's own metadata database, a
# seeded sample warehouse, Cube Store, and the Cube API (CLAUDE.md).
#
# `pnpm test` runs the api package against the metadata database, and `pnpm e2e`
# runs the whole stack. Ports are deliberately not the defaults, so an existing
# local Postgres or Cube is never touched.

services:
  wechart-meta:
    image: postgres:18-alpine
    container_name: wechart-meta
    environment:
      POSTGRES_USER: wechart
      POSTGRES_PASSWORD: wechart
      POSTGRES_DB: wechart_meta
    ports:
      - '55432:5432'
    volumes:
      # postgres:18+ wants a single mount at /var/lib/postgresql, not at
      # /var/lib/postgresql/data; it places the cluster in a subdirectory so a
      # later `pg_upgrade --link` does not cross a mount boundary. Mounting the
      # old path makes the container exit on start.
      - wechart-meta-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wechart -d wechart_meta']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # The warehouse Cube reads. Seeded once, on an empty volume, from every
  # infra/sample-db/*.sql in name order: generate.sql (tables to generate cubes
  # from, T145) and init.sql. A volume seeded before a script existed doesn't
  # have its tables: run it with `docker exec -i wechart-sample-db psql -U
  # sample -d sample < infra/sample-db/<script>.sql`.
  sample-db:
    image: postgres:18-alpine
    container_name: wechart-sample-db
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample
    ports:
      - '55433:5432'
    volumes:
      - wechart-sample-data:/var/lib/postgresql
      - ./infra/sample-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sample -d sample']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Cube Store backs the query queue and cache; the cache driver defaults to
  # cubestore in production mode (research/cube/configuration-deployment.md).
  #
  # The image is per-architecture: cubejs/cubestore:v1.7.45 is amd64 only, and
  # Apple Silicon needs the -arm64v8 tag; CUBESTORE_IMAGE picks the other.
  # v1.7.45, the user's choice of 2026-09-24 (research/cube/upgrade-1.7.43.md):
  # from v1.7.43 a failed build is no longer reported as done.
  cubestore:
    image: ${CUBESTORE_IMAGE:-cubejs/cubestore:v1.7.45-arm64v8}
    container_name: wechart-cubestore
    environment:
      CUBESTORE_SERVER_NAME: cubestore:9999
    volumes:
      - wechart-cubestore-data:/cube/data

  # The user's fork of Cube v1.7.45 (T275, R10): upstream v1.7.45 plus a
  # data-source introspection API, for generating cubes from a source's
  # tables (docs/research/cube/introspection-api.md), at the fork's commit
  # f6355de982 (research/cube/introspection-api-f6355de982.md). Built locally,
  # from the fork's checkout, and pushed nowhere; tagged by the fork's commit,
  # so a rebuild is a new tag, not the same one over again:
  #   docker build -f packages/cubejs-docker/overlay.Dockerfile -t cube:v1.7.45-introspection-<commit> .
  # Cube and its refresh worker run the same image.
  cube:
    image: ${CUBE_IMAGE:-cube:v1.7.45-introspection-f6355de982}
    container_name: wechart-cube
    depends_on: &cube-depends-on
      sample-db:
        condition: service_healthy
      cubestore:
        condition: service_started
    environment: &cube-environment
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: sample-db
      CUBEJS_DB_PORT: '5432'
      CUBEJS_DB_NAME: sample
      CUBEJS_DB_USER: sample
      CUBEJS_DB_PASS: sample
      # wechart signs every request with this and is the only holder of it
      # (AC-007, AC-008).
      CUBEJS_API_SECRET: ${CUBE_API_SECRET:-dev-secret}
      CUBEJS_CUBESTORE_HOST: cubestore
      # 3030 is Cube Store's HTTP port, which is what Cube speaks to. 3306 is
      # its MySQL interface, and pointing Cube at it fails with
      # "Parse Error: Expected HTTP/" (research/cube/configuration-deployment.md).
      CUBEJS_CUBESTORE_PORT: '3030'
      # Production mode: no Playground, authentication enforced, so local
      # development stays faithful to how it is deployed.
      CUBEJS_DEV_MODE: 'false'
      NODE_ENV: production
      # The model is read from wechart's store, named in each request's signed
      # security context, when it is one of these; otherwise from the mounted
      # directory (infra/cube/cube.js, T142). 4100 is the dev and browser-test
      # API, 4200 the local demo's.
      WECHART_MODEL_STORES: ${WECHART_MODEL_STORES:-http://host.docker.internal:4100,http://host.docker.internal:4200}
      # Presented to wechart's store to read the model; the API holds the same.
      WECHART_MODEL_KEY: ${WECHART_MODEL_KEY:-dev-model-key}
    extra_hosts: &cube-extra-hosts
      # The API runs on the host in development; Docker Desktop names it so
      # already, and this does on Linux.
      - 'host.docker.internal:host-gateway'
    ports:
      - '54000:4000'
    volumes: &cube-volumes
      - ./infra/cube/cube.js:/cube/conf/cube.js:ro
      - ./infra/cube/model:/cube/conf/model:ro

  # Cube's refresh worker: the same image and configuration, told only to
  # build and refresh pre-aggregations. The API instance above is in
  # production mode and builds none for queries — a query a rollup would serve
  # is refused until this has built it (docs/research/cube/refresh-jobs-caching.md,
  # "Topology"; pre-aggregations.md, "Observed locally"). A build asked for
  # through the jobs API runs in the API instance, though (upgrade-1.7.43.md).
  cube-refresh-worker:
    image: ${CUBE_IMAGE:-cube:v1.7.45-introspection-f6355de982}
    container_name: wechart-cube-refresh-worker
    depends_on: *cube-depends-on
    environment:
      <<: *cube-environment
      CUBEJS_REFRESH_WORKER: 'true'
    extra_hosts: *cube-extra-hosts
    # Its own /readyz and /livez, which say its state — wechart's
    # CUBE_WORKER_URL (T162, AC-156; research/cube/refresh-jobs-caching.md §F).
    # On this machine only: the API runs on the host, and the worker serves
    # Cube's whole REST API there too, not just its probes (T162's review).
    ports:
      - '127.0.0.1:54001:4000'
    volumes: *cube-volumes

  # The development and test OIDC provider (T315, AC-257; research/dex.md, the
  # user's R20): Dex 2.45.1 with static users and their groups
  # (infra/dex/config.yaml). Only for sign-in with security on, so it runs under
  # the `security` profile; the api tests start it themselves. Pinned by
  # digest: `latest` is Dex's master (research Gotcha 2).
  dex:
    image: dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
    container_name: wechart-dex
    profiles: [security]
    command: ['dex', 'serve', '/etc/dex/config.yaml']
    environment:
      # A test value for this application's development client only.
      WECHART_OIDC_CLIENT_SECRET: ${WECHART_OIDC_CLIENT_SECRET:-dev-oidc-secret}
    ports:
      # The browser and the API on the host both reach the issuer here.
      - '127.0.0.1:5556:5556'
    volumes:
      - ./infra/dex/config.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      # The alpine image's BusyBox wget, on the telemetry port (research §2).
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5558/healthz/ready']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  wechart-meta-data:
  wechart-sample-data:
  wechart-cubestore-data:
