# Local development and test dependencies: wechart's own metadata database, a
# seeded sample warehouse, Cube Store, and the Cube API (CLAUDE.md).
#
# `pnpm test` runs the api package against the metadata database, and `pnpm e2e`
# runs the whole stack. Ports are deliberately not the defaults, so an existing
# local Postgres or Cube is never touched.

# What both Cube processes, the API instance and the refresh worker, are given:
# extension fields, which Compose itself ignores.
x-cube-environment: &cube-environment
  CUBEJS_DB_TYPE: postgres
  CUBEJS_DB_HOST: sample-db
  CUBEJS_DB_PORT: '5432'
  CUBEJS_DB_NAME: sample
  CUBEJS_DB_USER: sample
  CUBEJS_DB_PASS: sample
  # wechart signs every request with this and is the only holder of it
  # (AC-007, AC-008).
  CUBEJS_API_SECRET: ${CUBE_API_SECRET:-dev-secret}
  CUBEJS_CUBESTORE_HOST: cubestore
  # 3030 is Cube Store's HTTP port, which is what Cube speaks to. 3306 is
  # its MySQL interface, and pointing Cube at it fails with
  # "Parse Error: Expected HTTP/" (research/cube/configuration-deployment.md).
  CUBEJS_CUBESTORE_PORT: '3030'
  # Production mode: no Playground, authentication enforced, so local
  # development stays faithful to how it is deployed.
  CUBEJS_DEV_MODE: 'false'
  NODE_ENV: production
  # xcube's schema in the metadata database (T447, AC-333): the models wechart's
  # APIs push, each named by its model id, which Cube serves whether or not any
  # API is running. A token naming no model reads the mounted directory
  # (research xcube-slice-2.md, "Token claims").
  XCUBE_DATABASE_URL: postgres://xcube:${XCUBE_DB_PASSWORD:-dev-xcube-password}@wechart-meta:5432/wechart_meta
  # The credential key xcube opens data sources' secrets with (T455, AC-324;
  # research xcube-slice-6.md, "Credential keys"): the development key, by its
  # kid, from the files mounted below. Unset, xcube would start holding none.
  XCUBE_CREDENTIAL_KEY_IDS: uYWeMx6i173fsiolFp1xi-qiav50k52AGinM56Y8JEw

x-cube-volumes: &cube-volumes
  - ./infra/cube/cube.js:/cube/conf/cube.js:ro
  - ./infra/cube/model:/cube/conf/model:ro

# xcube's development private key, which opens data-source credentials:
# mounted into the containers that run Cube's drivers and nowhere else,
# since wechart is given only the public half (T333, AC-298, AC-324;
# infra/xcube/README.md). A file named by its key id, as the research
# lays out xcube's keys (credential-sealing.md, "Key management").
x-cube-secrets: &cube-secrets
  - &xcube-credential-key
    source: xcube_credential_key
    target: /run/secrets/xcube-credential-keys/uYWeMx6i173fsiolFp1xi-qiav50k52AGinM56Y8JEw.pem
  # Its sample credential, which xcube opens at start to prove the key file is
  # the key (T455; xcube's keygen made it, research xcube-slice-6.md, "Init").
  - &xcube-credential-check
    source: xcube_credential_check
    target: /run/secrets/xcube-credential-keys/uYWeMx6i173fsiolFp1xi-qiav50k52AGinM56Y8JEw.check

services:
  wechart-meta:
    image: postgres:18-alpine
    container_name: wechart-meta
    environment:
      POSTGRES_USER: wechart
      POSTGRES_PASSWORD: wechart
      POSTGRES_DB: wechart_meta
    ports:
      - '55432:5432'
    volumes:
      # postgres:18+ wants a single mount at /var/lib/postgresql, not at
      # /var/lib/postgresql/data; it places the cluster in a subdirectory so a
      # later `pg_upgrade --link` does not cross a mount boundary. Mounting the
      # old path makes the container exit on start.
      - wechart-meta-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wechart -d wechart_meta']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # The warehouse Cube reads. Seeded once, on an empty volume, from every
  # infra/sample-db/*.sql in name order: generate.sql (tables to generate cubes
  # from, T145) and init.sql. A volume seeded before a script existed doesn't
  # have its tables: run it with `docker exec -i wechart-sample-db psql -U
  # sample -d sample < infra/sample-db/<script>.sql`.
  sample-db:
    image: postgres:18-alpine
    container_name: wechart-sample-db
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample
    ports:
      - '55433:5432'
    volumes:
      - wechart-sample-data:/var/lib/postgresql
      - ./infra/sample-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sample -d sample']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # xcube's role and schema in the metadata database (T447; research
  # xcube-slice-2.md, "Database bootstrap"), made once before either Cube
  # process starts: a Cube process whose schema is missing exits rather than
  # retrying (Gotcha 14). Running it again changes nothing but the password.
  xcube-db-init:
    image: postgres:18-alpine
    container_name: wechart-xcube-db-init
    depends_on:
      wechart-meta:
        condition: service_healthy
    environment:
      PGPASSWORD: wechart
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -v
      - xcube_password=${XCUBE_DB_PASSWORD:-dev-xcube-password}
      - -h
      - wechart-meta
      - -U
      - wechart
      - -d
      - wechart_meta
      - -f
      - /bootstrap.sql
    volumes:
      - ./infra/xcube/bootstrap.sql:/bootstrap.sql:ro

  # Cube Store backs the query queue and cache; the cache driver defaults to
  # cubestore in production mode (research/cube/configuration-deployment.md).
  #
  # The image is per-architecture: cubejs/cubestore:v1.7.45 is amd64 only, and
  # Apple Silicon needs the -arm64v8 tag; CUBESTORE_IMAGE picks the other.
  # v1.7.45, the user's choice of 2026-09-24 (research/cube/upgrade-1.7.43.md):
  # from v1.7.43 a failed build is no longer reported as done.
  cubestore:
    image: ${CUBESTORE_IMAGE:-cubejs/cubestore:v1.7.45-arm64v8}
    container_name: wechart-cubestore
    # No CUBESTORE_QUERY_TIMEOUT: Cube Store's is 120 s unset, as xcube's
    # XCUBE_CUBESTORE_QUERY_TIMEOUT is, which says until when a stopped SQL
    # run on its select workers runs on (T548; docs/research/
    # xcube-2099b13f2d.md). It doesn't reach a query Cube Store's router
    # runs (T549; xcube-46ca0ce708.md). Set one, set the other to match, on
    # the cube service.
    environment:
      CUBESTORE_SERVER_NAME: cubestore:9999
    volumes:
      - wechart-cubestore-data:/cube/data

  # Cube v1.7.45, unmodified, with the user's fork's package xcube (T275,
  # T413, T417, R10): a data-source introspection API for generating cubes
  # from a source's tables (docs/research/cube/introspection-api.md), and,
  # from the fork's commit 83cb9f0888, the model served from xcube's own
  # schema in the metadata database, which wechart's API pushes to (T447,
  # AC-333; docs/research/xcube-slice-2.md). From c0610bb768 it serves the
  # model as items, names resolved in folders and compiled in modules (T449;
  # xcube-slice-3a.md, xcube-slice-3b.md). From ed08180c37 it carries slices
  # 4-6: the folder gate and RS256 tokens, overlays, connections (T420, R31;
  # xcube-slice-4.md, -5.md, -6.md, xcube-overlay-data-sources.md); from
  # e53cf2a8b8, each cube's bound data source in its items, a rebound cube's
  # own SQL alias and the connection heartbeat (T459; xcube-22132c309c.md,
  # xcube-e53cf2a8b8.md); from 919cff8c6e, a data source changed in place
  # served from its new target at once, a cube's names kept while its data
  # source is at the target it was first served with (R38), and the folder
  # 403 on GET /v1/sql and /v1/dry-run (T501; xcube-4754c2c960.md,
  # xcube-bc18f82c01.md, xcube-2d5ac86f24.md, xcube-919cff8c6e.md); from
  # 89628a0e88, the read-only SQL runner on a data source's connection and on
  # Cube Store, with its cancel (T532, R50; xcube-sql-runner.md); from
  # 6d9673ccda, a run stopped or cancelled answers the rows it read before
  # (T545; xcube-6d9673ccda.md); from 93a5f7a73b, introspection of a
  # workspace overlay's own data source (T547; xcube-93a5f7a73b.md); from
  # 2099b13f2d, a Cube Store run stopped or cancelled said still running
  # until when, followed to its end, and each run's state (T548;
  # xcube-2099b13f2d.md), with xcube's migration 13; from 46ca0ce708, a
  # query Cube Store's router runs followed to its real end, with no end
  # said (T549; xcube-46ca0ce708.md); from 74c933bdb8, a building build the
  # queue's cancel takes out really stopped, none of it kept (T554;
  # xcube-74c933bdb8.md); from 256d632371, one name per item model-wide and
  # every reference up its folder path, bare names on every route, and schema
  # 14, which refuses a folder-prefixed schema: dropped and seeded again (T701,
  # T702, R71, R72; xcube-256d632371.md); from 407622a6b8, `rollupOnly` on
  # GET …/revision, whether the answering instance runs the model in
  # rollup-only mode (T690, AC-147; xcube-407622a6b8.md); from bb188d8ada, the
  # SQL runner's `{{name}}` values bound (`parameters`), and the catalog's
  # foreign keys through a stored connection (T811, T806; xcube-bb188d8ada.md).
  # The stored root `default` matches
  # CUBEJS_DB_* above exactly, so the root's cubes keep their names. The image
  # is published for amd64 and arm64 (bb188d8ada from xcube's machine, CI's
  # Actions being off), pulled here by digest: its moving tag isn't a version.
  # The image's own CMD starts the package's server: give neither service a
  # `command`, or Cube starts without the routes. Cube and its refresh worker
  # run the same image.
  cube:
    image: ${CUBE_IMAGE:-ghcr.io/senthilkrajagopal/xcube:v1.7.45-bb188d8ada@sha256:96024be5ca88d227ff456a0d832642e9a42a27c6a7d55187520a00d84389f63f}
    container_name: wechart-cube
    depends_on: &cube-depends-on
      sample-db:
        condition: service_healthy
      cubestore:
        condition: service_started
      xcube-db-init:
        condition: service_completed_successfully
    environment:
      <<: *cube-environment
      # wechart's service credential's public half (T420, AC-326; slice 4):
      # xcube's admin routes, the jobs API and introspection take its tokens.
      # On the API instance only, which serves them; the worker verifies no
      # token of wechart's (research xcube-slice-4.md, "Environment"). The
      # static admin token it replaced is retired: none is set.
      XCUBE_SERVICE_KEYS_FILE: /run/secrets/xcube-service-keys
    # Cube calls nothing of wechart's (T431, AC-327), so no host name is added
    # for the API on the host (Docker Desktop resolves host.docker.internal
    # regardless; e2e/no-callbacks.spec.ts watches for such a call).
    ports:
      - '54000:4000'
    volumes: *cube-volumes
    secrets:
      - *xcube-credential-key
      - *xcube-credential-check
      - xcube-service-keys

  # Cube's refresh worker: the same image and configuration, told only to
  # build and refresh pre-aggregations. The API instance above is in
  # production mode and builds none for queries — a query a rollup would serve
  # is refused until this has built it (docs/research/cube/refresh-jobs-caching.md,
  # "Topology"; pre-aggregations.md, "Observed locally"). A build asked for
  # through the jobs API runs in the API instance, though (upgrade-1.7.43.md).
  cube-refresh-worker:
    image: ${CUBE_IMAGE:-ghcr.io/senthilkrajagopal/xcube:v1.7.45-bb188d8ada@sha256:96024be5ca88d227ff456a0d832642e9a42a27c6a7d55187520a00d84389f63f}
    container_name: wechart-cube-refresh-worker
    depends_on: *cube-depends-on
    environment:
      <<: *cube-environment
      CUBEJS_REFRESH_WORKER: 'true'
    # Its own /readyz and /livez, which say its state — wechart's
    # CUBE_WORKER_URL (T162, AC-156; research/cube/refresh-jobs-caching.md §F).
    # On this machine only: the API runs on the host, and the worker serves
    # Cube's whole REST API there too, not just its probes (T162's review).
    ports:
      - '127.0.0.1:54001:4000'
    volumes: *cube-volumes
    secrets: *cube-secrets

  # The development and test OIDC provider (T315, AC-257; research/dex.md, the
  # user's R20): Dex 2.45.1 with static users and their groups
  # (infra/dex/config.yaml). Only for sign-in with security on, so it runs under
  # the `security` profile; the api tests start it themselves. Pinned by
  # digest: `latest` is Dex's master (research Gotcha 2).
  dex:
    image: dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
    container_name: wechart-dex
    profiles: [security]
    command: ['dex', 'serve', '/etc/dex/config.yaml']
    environment:
      # A test value for this application's development client only.
      WECHART_OIDC_CLIENT_SECRET: ${WECHART_OIDC_CLIENT_SECRET:-dev-oidc-secret}
    ports:
      # The browser and the API on the host both reach the issuer here.
      - '127.0.0.1:5556:5556'
    volumes:
      - ./infra/dex/config.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      # The alpine image's BusyBox wget, on the telemetry port (research §2).
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5558/healthz/ready']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  wechart-meta-data:
  wechart-sample-data:
  wechart-cubestore-data:

secrets:
  # Development only: the fixed key pair's private half (infra/xcube/README.md).
  xcube_credential_key:
    file: ./infra/xcube/dev-credential-key.pem
  xcube_credential_check:
    file: ./infra/xcube/dev-credential-key.check
  # Development only: the public half of wechart's service key (T420;
  # infra/xcube/README.md). Its private half is the API's alone.
  xcube-service-keys:
    file: ./infra/xcube/dev-service-key.pub.pem
