  /* ---------- base ---------- */
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--text-primary);
    font: 400 14px/20px var(--font-ui);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  * {
    box-sizing: border-box;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .tnum {
    font-variant-numeric: tabular-nums;
  }
  .muted {
    color: var(--text-muted);
  }
  .sec {
    color: var(--text-secondary);
  }
  .xs {
    font-size: 12px;
    line-height: 16px;
  }
  .strong {
    font-weight: 600;
  }
  .mono {
    font-family: var(--font-code);
    font-size: 12px;
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
      animation: none !important;
    }
  }

  /* ---------- shell ---------- */
  .app {
    display: grid;
    grid-template-rows: 48px 1fr;
    height: 100%;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 12px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    background: var(--accent);
    display: grid;
    place-items: center;
    color: var(--text-on-accent);
    font-size: 12px;
    font-weight: 600;
  }
  .wsnav {
    display: flex;
    gap: 2px;
    height: 100%;
  }
  .wsnav button {
    border: 0;
    background: none;
    padding: 0 12px;
    height: 100%;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
  }
  .wsnav button:hover {
    color: var(--text-primary);
  }
  .wsnav button[aria-current='page'] {
    color: var(--text-primary);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .topbar .spacer {
    flex: 1;
  }
  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 260px;
    height: 32px;
    padding: 0 10px;
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    background: var(--bg-subtle);
    color: var(--text-muted);
    font-size: 13px;
  }
  .search kbd {
    margin-left: auto;
    font: 600 12px var(--font-ui);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 0 4px;
  }
  .iconbtn {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border: 1px solid transparent;
    border-radius: 6px;
    background: none;
    color: var(--text-secondary);
  }
  .iconbtn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--role-dim-soft);
    color: var(--role-dim);
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 600;
  }
  .view {
    display: none;
    min-height: 0;
  }
  .view.active {
    display: grid;
  }
  .proto-note {
    position: fixed;
    left: 12px;
    bottom: 12px;
    z-index: 50;
    font-size: 12px;
    background: var(--bg-raised);
    border: 1px solid var(--border-subtle);
    border-radius: 999px;
    padding: 4px 10px;
    color: var(--text-secondary);
    box-shadow: var(--shadow-pop);
  }

  /* ---------- buttons, inputs ---------- */
  .btn {
    height: 32px;
    padding: 0 12px;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    background: var(--bg-surface);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover {
    background: var(--bg-hover);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--text-on-accent);
    font-weight: 600;
  }
  .btn.primary:hover {
    filter: brightness(1.08);
  }
  .btn.ghost {
    border-color: transparent;
    background: none;
  }
  .btn.sm {
    height: 24px;
    padding: 0 8px;
    font-size: 12px;
  }
  .input,
  .select {
    height: 32px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--bg-surface);
    padding: 0 8px;
    min-width: 0;
    width: 100%;
  }
  .select {
    padding-right: 4px;
  }
  .input.sm,
  .select.sm {
    height: 28px;
    font-size: 12px;
  }
  textarea.input {
    height: auto;
    padding: 6px 8px;
    font-family: var(--font-code);
    font-size: 12px;
    line-height: 18px;
    resize: vertical;
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    overflow: hidden;
  }
  .seg button {
    border: 0;
    background: var(--bg-surface);
    height: 28px;
    padding: 0 10px;
    font-size: 12px;
    border-left: 1px solid var(--border-subtle);
  }
  .seg button:first-child {
    border-left: 0;
  }
  .seg button[aria-pressed='true'] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .switch {
    position: relative;
    width: 32px;
    height: 18px;
    border-radius: 999px;
    background: var(--border-strong);
    border: 0;
    padding: 0;
    flex: none;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--bg-surface);
    transition: left 0.12s;
  }
  .switch[aria-checked='true'] {
    background: var(--accent);
  }
  .switch[aria-checked='true']::after {
    left: 16px;
  }

  /* ---------- workbench panes ---------- */
  .workbench {
    grid-template-columns: 280px 1fr 320px;
    min-height: 0;
    height: 100%;
  }
  .pane {
    background: var(--bg-surface);
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .pane.left {
    border-right: 1px solid var(--border-subtle);
  }
  .pane.right {
    border-left: 1px solid var(--border-subtle);
  }
  .pane-head {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .pane-head h2 {
    margin: 0;
    font-size: 14px;
    line-height: 20px;
    font-weight: 600;
  }
  .pane-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
  }
  .center {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .tabs {
    display: flex;
    gap: 2px;
    padding: 0 8px;
    border-bottom: 1px solid var(--border-subtle);
    background: var(--bg-surface);
    overflow-x: auto;
  }
  .tabs button {
    border: 0;
    background: none;
    height: 36px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tabs button[aria-selected='true'] {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .section {
    padding: 12px;
    border-bottom: 1px solid var(--border-subtle);
    display: grid;
    gap: 8px;
  }
  .section > h3 {
    margin: 0;
    font-size: 12px;
    line-height: 16px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .field {
    display: grid;
    gap: 4px;
  }
  .field > label,
  .field > .lbl {
    font-size: 12px;
    line-height: 16px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .inline {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 28px;
    font-size: 12px;
  }
  .inline > span:first-child {
    flex: 1;
  }

  /* ---------- field tree ---------- */
  .tree-search {
    padding: 8px 12px;
  }
  .tgroup {
    padding: 4px 0;
  }
  .tgroup-head {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    border: 0;
    background: none;
    width: 100%;
    text-align: left;
  }
  .tgroup-head .count {
    margin-left: auto;
    font-weight: 400;
    color: var(--text-muted);
  }
  .frow {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 28px;
    padding: 0 12px 0 22px;
    font-size: 12px;
    cursor: grab;
    border-radius: 4px;
    margin: 0 4px;
    user-select: none;
  }
  .frow:hover {
    background: var(--bg-hover);
  }
  .frow.used .fname::after {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: 6px;
    vertical-align: middle;
  }
  .ficon {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 600;
    flex: none;
    font-family: var(--font-code);
  }
  .ficon.dim {
    color: var(--role-dim);
    background: var(--role-dim-soft);
  }
  .ficon.measure {
    color: var(--role-measure);
    background: var(--role-measure-soft);
  }
  .fname {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fmeta {
    color: var(--text-muted);
    font-size: 12px;
  }

  /* ---------- wells ---------- */
  .wells {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
  }
  .well {
    border: 1px dashed var(--border-strong);
    border-radius: 6px;
    padding: 6px;
    min-height: 40px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    position: relative;
    background: var(--bg-surface);
  }
  .well-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    width: 58px;
    flex: none;
  }
  .well.legal {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .well.illegal {
    opacity: 0.55;
  }
  .well.illegal::after {
    content: attr(data-reason);
    position: absolute;
    left: 6px;
    right: 6px;
    bottom: -2px;
    transform: translateY(100%);
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
    line-height: 14px;
    color: var(--err);
    z-index: 5;
    box-shadow: var(--shadow-pop);
  }
  .well.over {
    border-style: solid;
  }
  .pill {
    height: 24px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0 4px 0 6px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    max-width: 100%;
  }
  .pill.dim {
    background: var(--role-dim-soft);
    color: var(--role-dim);
  }
  .pill.measure {
    background: var(--role-measure-soft);
    color: var(--role-measure);
  }
  .pill .agg {
    font-weight: 400;
    opacity: 0.85;
  }
  .pill button {
    border: 0;
    background: none;
    width: 18px;
    height: 18px;
    border-radius: 3px;
    color: inherit;
    display: grid;
    place-items: center;
    padding: 0;
  }
  .pill button:hover {
    background: rgba(127, 127, 127, 0.2);
  }
  .addbtn {
    border: 0;
    background: none;
    color: var(--text-muted);
    height: 24px;
    padding: 0 6px;
    border-radius: 4px;
    font-size: 12px;
  }
  .addbtn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .picker {
    position: absolute;
    top: 100%;
    left: 0;
    z-index: 20;
    margin-top: 4px;
    width: 240px;
    max-height: 280px;
    overflow: auto;
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    box-shadow: var(--shadow-pop);
    padding: 4px;
  }
  .picker button {
    display: flex;
    width: 100%;
    align-items: center;
    gap: 8px;
    height: 28px;
    border: 0;
    background: none;
    border-radius: 4px;
    font-size: 12px;
    text-align: left;
    padding: 0 6px;
  }
  .picker button:hover,
  .picker button:focus-visible {
    background: var(--bg-hover);
  }
  .picker button[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* ---------- chart canvas ---------- */
  .canvas-wrap {
    flex: 1;
    min-height: 0;
    padding: 12px;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 8px;
  }
  .canvas-tool {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .canvas-tool h1 {
    margin: 0;
    font-size: 16px;
    line-height: 22px;
    font-weight: 600;
    margin-right: 8px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    font-size: 12px;
    background: var(--bg-subtle);
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .badge.ok {
    color: var(--ok);
  }
  .badge.accent {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .badge.cross {
    background: var(--crossfilter-soft);
    color: var(--crossfilter);
    font-weight: 600;
  }
  .tile {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 16px;
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .tile-head {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 20px;
    margin-bottom: 8px;
  }
  .tile-head h3 {
    margin: 0;
    font-size: 14px;
    line-height: 20px;
    font-weight: 600;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chart {
    flex: 1;
    min-height: 160px;
    min-width: 0;
  }
  .drawer {
    border-top: 1px solid var(--border-subtle);
    background: var(--bg-surface);
    height: 220px;
    display: flex;
    flex-direction: column;
  }
  .drawer.closed {
    height: 36px;
  }
  .drawer .tabs {
    border-bottom: 1px solid var(--border-subtle);
  }
  .drawer-body {
    flex: 1;
    overflow: auto;
  }
  .grid-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .grid-table th {
    position: sticky;
    top: 0;
    background: var(--bg-subtle);
    text-align: left;
    font-weight: 600;
    height: 28px;
    padding: 0 8px;
    border-bottom: 1px solid var(--border-subtle);
    white-space: nowrap;
  }
  .grid-table td {
    height: 24px;
    padding: 0 8px;
    border-bottom: 1px solid var(--border-subtle);
    white-space: nowrap;
  }
  .grid-table td.num,
  .grid-table th.num {
    text-align: right;
  }
  .grid-table.comfy td {
    height: 34px;
  }
  .grid-table tr.sel td {
    background: var(--accent-soft);
  }
  .grid-table tbody tr:hover td {
    background: var(--bg-hover);
  }

  /* ---------- recommendations ---------- */
  .reco-top {
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 10px;
    display: grid;
    gap: 4px;
  }
  .reco-top .k {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .reco-row {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 8px;
    align-items: start;
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 8px;
    background: var(--bg-surface);
    text-align: left;
    width: 100%;
  }
  .reco-row:hover {
    border-color: var(--border-strong);
    background: var(--bg-hover);
  }
  .reco-row[aria-pressed='true'] {
    border-color: var(--accent);
  }
  .reco-row .ico,
  .reco-top .ico {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--bg-subtle);
    display: grid;
    place-items: center;
    color: var(--text-secondary);
  }
  .reco-name {
    font-size: 12px;
    font-weight: 600;
  }
  .reco-why {
    font-size: 12px;
    line-height: 16px;
    color: var(--text-secondary);
  }
  .na {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  .na button {
    border: 1px solid var(--border-subtle);
    background: var(--bg-surface);
    border-radius: 6px;
    min-height: 52px;
    line-height: 14px;
    text-align: center;
    display: grid;
    place-items: center;
    gap: 0;
    font-size: 12px;
    color: var(--text-muted);
    padding: 4px 2px;
  }
  .na button:hover {
    border-color: var(--border-strong);
    color: var(--text-primary);
  }
  .na button.off {
    opacity: 0.45;
  }
  .pinned {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    background: var(--bg-subtle);
    font-size: 12px;
  }

  /* ---------- dashboard ---------- */
  .dash {
    grid-template-rows: auto auto 1fr;
    min-height: 0;
    height: 100%;
    overflow: hidden;
  }
  .dash-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px 0;
    flex-wrap: wrap;
  }
  .dash-head h1 {
    margin: 0;
    font-size: 24px;
    line-height: 32px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .dash-tabs {
    display: flex;
    gap: 4px;
    padding: 8px 24px 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .dash-tabs button {
    border: 0;
    background: none;
    height: 36px;
    padding: 0 12px;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
  }
  .dash-tabs button[aria-selected='true'] {
    color: var(--text-primary);
    border-bottom-color: var(--accent);
  }
  .filterbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    flex-wrap: wrap;
    background: var(--bg-page);
    border-bottom: 1px solid var(--border-subtle);
  }
  .fw {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--bg-surface);
    padding: 0 6px 0 10px;
    font-size: 13px;
    position: relative;
  }
  .fw .scope {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    border: 1px solid var(--border-subtle);
    border-radius: 3px;
    padding: 0 4px;
  }
  .fw select {
    border: 0;
    background: none;
    height: 28px;
    font-weight: 600;
    max-width: 180px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 24px;
    padding: 0 4px 0 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: var(--crossfilter-soft);
    color: var(--crossfilter);
    border: 1px solid var(--crossfilter);
  }
  .chip button {
    border: 0;
    background: none;
    color: inherit;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    padding: 0;
  }
  .chip button:hover {
    background: rgba(127, 127, 127, 0.2);
  }
  .dash-scroll {
    overflow: auto;
    min-height: 0;
  }
  .dgrid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 16px;
    padding: 16px 24px 40px;
    max-width: 1440px;
    margin: 0 auto;
    align-items: start;
  }
  .dgrid .tile.crossing {
    border-color: var(--crossfilter);
    box-shadow: 0 0 0 1px var(--crossfilter);
  }
  .dgrid .tile.filtered .fdot {
    display: inline-block;
  }
  .fdot {
    display: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--crossfilter);
  }
  .kpi-val {
    font-size: 32px;
    line-height: 40px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .kpi-delta {
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .md {
    font-size: 14px;
    line-height: 22px;
    color: var(--text-secondary);
    max-width: 90ch;
  }
  .md h2 {
    font-size: 20px;
    line-height: 26px;
    margin: 0 0 4px;
    color: var(--text-primary);
    font-weight: 600;
  }
  .md strong {
    color: var(--text-primary);
  }
  .token {
    font-family: var(--font-code);
    font-size: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 4px;
    padding: 1px 4px;
  }
  .viewas {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 24px;
    background: var(--crossfilter-soft);
    color: var(--crossfilter);
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid var(--crossfilter);
  }
  .viewas.on {
    display: flex;
  }
  .palette {
    position: fixed;
    right: 16px;
    top: 64px;
    width: 260px;
    z-index: 30;
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    box-shadow: var(--shadow-pop);
    display: none;
  }
  .palette.on {
    display: block;
  }
  .palette .el {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 36px;
    padding: 0 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--border-subtle);
    cursor: grab;
  }

  /* ---------- model editor ---------- */
  .model {
    grid-template-columns: 240px minmax(0, 1.15fr) minmax(380px, 1fr);
    height: 100%;
    min-height: 0;
  }
  .file {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 28px;
    padding: 0 12px 0 24px;
    font-size: 12px;
    font-family: var(--font-code);
    border: 0;
    background: none;
    width: 100%;
    text-align: left;
  }
  .file[aria-current='true'] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .file:hover {
    background: var(--bg-hover);
  }
  .dir {
    height: 28px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .editor-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border-subtle);
    background: var(--bg-surface);
    min-height: 44px;
    flex-wrap: wrap;
  }
  .editor-host {
    flex: 1;
    min-height: 0;
    background: var(--bg-surface);
  }
  .editor-host .CodeMirror {
    height: 100%;
    font-family: var(--font-code);
    font-size: 12.5px;
    line-height: 19px;
    background: var(--bg-surface);
    color: var(--text-primary);
  }
  .editor-host .CodeMirror-gutters {
    background: var(--bg-subtle);
    border-right: 1px solid var(--border-subtle);
  }
  .editor-host .CodeMirror-linenumber {
    color: var(--text-muted);
  }
  .editor-host .CodeMirror-cursor {
    border-left-color: var(--text-primary);
  }
  .editor-host .cm-atom {
    color: var(--cm-key);
  }
  .editor-host .cm-string,
  .editor-host .cm-string-2 {
    color: var(--cm-str);
  }
  .editor-host .cm-number {
    color: var(--cm-num);
  }
  .editor-host .cm-comment {
    color: var(--cm-com);
    font-style: italic;
  }
  .editor-host .cm-meta,
  .editor-host .cm-def,
  .editor-host .cm-keyword {
    color: var(--cm-atom);
  }
  .editor-host .cm-errline {
    background: rgba(208, 59, 59, 0.12);
  }
  .problems {
    height: 150px;
    border-top: 1px solid var(--border-subtle);
    background: var(--bg-surface);
    overflow: auto;
  }
  .prob {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    gap: 8px;
    align-items: center;
    min-height: 28px;
    padding: 2px 12px;
    font-size: 12px;
    border-bottom: 1px solid var(--border-subtle);
    cursor: pointer;
  }
  .prob:hover {
    background: var(--bg-hover);
  }
  .warnbar {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 8px 12px;
    font-size: 12px;
    background: color-mix(in srgb, var(--warn-icon) 16%, var(--bg-surface));
    border-bottom: 1px solid var(--border-subtle);
  }
  .mrow {
    border-bottom: 1px solid var(--border-subtle);
  }
  .mrow-head {
    display: grid;
    grid-template-columns: 20px 1fr auto auto;
    gap: 8px;
    align-items: center;
    min-height: 34px;
    padding: 4px 12px;
    cursor: pointer;
    background: none;
    border: 0;
    width: 100%;
    text-align: left;
    font-size: 12px;
  }
  .mrow-head:hover {
    background: var(--bg-hover);
  }
  .mrow-head .sqlp {
    grid-column: 2 / -1;
    font-family: var(--font-code);
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mrow-body {
    padding: 4px 12px 12px 40px;
    display: grid;
    gap: 8px;
    background: var(--bg-subtle);
  }
  .mbadge {
    font-size: 12px;
    font-weight: 600;
    padding: 0 5px;
    border-radius: 3px;
    border: 1px solid var(--border-strong);
    color: var(--text-secondary);
    height: 18px;
    display: inline-flex;
    align-items: center;
  }
  .formbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .readonly-veil {
    padding: 16px;
    font-size: 13px;
    color: var(--err);
    display: flex;
    gap: 8px;
  }

  /* ---------- admin tables & status ---------- */
  .admin {
    grid-template-columns: minmax(0, 1fr) 400px;
    height: 100%;
    min-height: 0;
  }
  .admin-main {
    padding: 16px 24px;
    overflow: auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .admin-main h1 {
    margin: 0;
    font-size: 20px;
    line-height: 26px;
    font-weight: 600;
  }
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .status svg {
    flex: none;
  }
  .status.ok {
    color: var(--ok);
  }
  .status.warn {
    color: var(--warn);
  }
  .status.err {
    color: var(--err);
  }
  .status.run {
    color: var(--accent);
  }
  .status.idle {
    color: var(--text-secondary);
  }
  .durbar {
    width: 90px;
    height: 6px;
    border-radius: 3px;
    background: var(--bg-subtle);
    position: relative;
    display: inline-block;
    vertical-align: middle;
  }
  .durbar i {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    border-radius: 3px;
    background: var(--text-muted);
  }
  .durbar b {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    background: var(--text-primary);
  }
  .checks {
    display: grid;
    gap: 4px;
  }
  .check {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    gap: 8px;
    align-items: center;
    min-height: 28px;
    font-size: 12px;
  }
  .pgrid {
    border-collapse: separate;
    border-spacing: 0;
    font-size: 12px;
  }
  .pgrid th,
  .pgrid td {
    border-bottom: 1px solid var(--border-subtle);
    border-right: 1px solid var(--border-subtle);
    height: 34px;
    padding: 0 10px;
    white-space: nowrap;
  }
  .pgrid th {
    background: var(--bg-subtle);
    font-weight: 600;
    text-align: left;
    position: sticky;
    top: 0;
  }
  .pgrid td.cell {
    cursor: pointer;
  }
  .pgrid td.cell:hover {
    background: var(--bg-hover);
  }
  .pgrid td.cell[aria-selected='true'] {
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .lvl {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .lvl i {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    display: inline-block;
  }
  .tscroll {
    overflow: auto;
  }

  /* ---------- dashboard v3: WYSIWYG editing ---------- */
  .dash {
    grid-template-rows: auto auto auto 1fr;
  }
  .dash-head nav {
    display: flex;
    align-items: center;
    gap: 2px;
    width: 100%;
  }
  .dtile {
    position: relative;
  }
  .tile-head .tile-actions {
    display: inline-flex;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .dtile:hover .tile-actions,
  .dtile:focus-within .tile-actions,
  .dtile.selected .tile-actions,
  .dplain:hover .tile-actions,
  .dsection-head:hover .tile-actions,
  .dplain.selected .tile-actions,
  .dsection.selected > .dsection-head .tile-actions {
    opacity: 1;
  }
  .tile-actions .iconbtn {
    width: 26px;
    height: 26px;
  }
  .tile-head .tile-actions {
    margin-block: -3px;
  }
